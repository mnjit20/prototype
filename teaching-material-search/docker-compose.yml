services:
  postgres:
    image: postgres:16
    container_name: teaching-material-search-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: teaching_materials
    ports:
      - "5432:5432"
    volumes:
      - teaching_material_search_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d teaching_materials"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  teaching_material_search_data:
