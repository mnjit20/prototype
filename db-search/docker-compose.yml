services:
  db:
    image: postgres:16
    container_name: db-search-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: db-search
    ports:
      # - "5433:5432" 
      # TODO: remove 5433 port config once deployed.
      - "5432:5432" 
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db-search"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
