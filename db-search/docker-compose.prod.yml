services:
  db:
    image: postgres:16
    container_name: meinunterricht-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meinunterricht
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meinunterricht"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    container_name: meinunterricht-app
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://postgres:postgres@db:5432/meinunterricht
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3000:3000"

volumes:
  pgdata:
